<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiderRobot Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            height: 100vh;
            display: flex;
        }

        .video-container {
            flex: 2.5;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .video-frame {
            flex: 1;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .video-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-section h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #8b5cf6;
            font-weight: 600;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .control-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .btn-1 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .btn-1:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }

        .btn-2 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-2:hover {
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
        }

        .btn-3 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.3);
        }

        .btn-3:hover {
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.5);
        }

        .btn-4 {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            box-shadow: 0 4px 15px rgba(48, 207, 208, 0.3);
        }

        .btn-4:hover {
            box-shadow: 0 6px 20px rgba(48, 207, 208, 0.5);
        }

        .status-box {
            margin-top: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-box h3 {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 8px;
        }

        #statusMessage {
            color: #8b5cf6;
            font-size: 14px;
        }

        .emoji {
            font-size: 20px;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <div class="header">
            <h1>🕷️ SpiderRobot Live Feed</h1>
        </div>
        <div class="video-frame">
            <img src="/video_feed" alt="Robot Camera Feed">
        </div>
    </div>

    <div class="controls-panel">
        <div class="controls-section">
            <h2>Robot Controls</h2>
            <div class="button-grid">
                <h3>Predefined Sequences</h3>
                <br>
                <button class="control-btn btn-1" onclick="pressButton(1)">
                    Stand Up
                </button>
                <button class="control-btn btn-2" onclick="pressButton(2)">
                    Sit Down
                </button>
                <button class="control-btn btn-3" onclick="pressButton(3)">
                    Walk
                </button>
                <button class="control-btn btn-4" onclick="pressButton(4)">
                    Pause
                </button>
            </div>
        </div>

        <div class="status-box">
            <h3>Status</h3>
            <div id="statusMessage">Ready</div>
        </div>
    </div>

    <script>
        function pressButton(buttonId) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = `Button ${buttonId} pressed...`;

            fetch(`/button/${buttonId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(response => response.json())
                .then(data => {
                    statusMessage.textContent = `✓ ${data.message}`;
                    console.log(`Button ${buttonId} response:`, data);
                })
                .catch(error => {
                    statusMessage.textContent = `✗ Error: ${error}`;
                    console.error('Error:', error);
                });
        }
    </script>
</body>

</html>
